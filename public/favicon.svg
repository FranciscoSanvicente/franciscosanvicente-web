  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 82 H76" stroke="#5B6068"/>
    <path d="M28 66 L50 56 L72 66" stroke="#7A8088"/>
    <path d="M28 49 L50 39 L72 49" stroke="#9AA0A6"/>
    <path d="M28 32 L50 22 L72 32" stroke="#E7B857"/>
  </g>
</svg>
